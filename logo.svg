<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Sphere / Pulse Icon -->
  <g transform="translate(10, 10)">
    <circle cx="20" cy="20" r="18" stroke="url(#logo-grad)" stroke-width="2.5" fill="#071124" />
    <circle cx="20" cy="20" r="10" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2" />
    <path d="M12 20h4l2-5 4 10 3-7 2 2h3" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Brand Text -->
